name: Docs Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-structure:
    name: docs-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require top-level docs entrypoints
        run: |
          set -euo pipefail
          test -f index.md || test -f README.md
          test -d admin-guide || test -d user-guide || test -d concepts
          echo "Docs tree looks present"
